# =============================================================================
# Prisma AIRS as an AI Policy on Kong AI Gateway 2.x — LLM routes
#
# Shape : AI Gateway 2.x control plane in Konnect, self-managed data planes
# Apply : kongctl apply -f config/llm/airs-guardrail.yaml --pat "$KONNECT_PAT"
# Needs : an AI Gateway instance, one AI Model, and a Prisma AIRS API Intercept
#         application with a named security profile
#
# This is NOT a plugin. Kong AI Gateway 2.x expresses configuration as AI
# entities and AI Policies; a policy is what a plugin used to be, and Kong's own
# changelog says so: "policies are a control plane concept. In the runtime
# they're implemented as plugins." Nothing here is installed on a data plane and
# no image is rebuilt. There IS Lua — in the `functions` block below — but it
# travels inside the configuration rather than as a package.
#
# DO NOT EDIT THE FUNCTION BODIES HERE. They are generated from lua/guardrail/
# by scripts/build-config.py so that the Lua is lintable and unit-tested rather
# than living only as a quoted string. Edit the .lua file and rebuild.
#
# -----------------------------------------------------------------------------
# CLAIM STATUS. Every assertion in this file is one of three things, and they
# are never mixed silently:
#
#   DOCUMENTED    — from the AI Gateway 2.x POLICY schema at
#                   developer.konghq.com/ai-gateway/policies/ai-custom-guardrail/reference/
#                   (note: the Kong Gateway 3.x PLUGIN schema is a DIFFERENT and
#                   smaller contract — four config keys exist only on the policy.
#                   scripts/check-policy-schema.py validates against the policy
#                   schema for exactly this reason.)
#   MEASURED      — established on a live gateway by someone, with the date and
#                   the runtime version. Attribution is in docs/CREDITS.md.
#   UNVERIFIED    — believed, not tested. Every one of these is a row in
#                   docs/DESIGN.md and none of them is claimed in the README.
# =============================================================================

ai_gateway_policies:

  - ref: airs-scan
    ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
    name: airs-scan
    display_name: "Prisma AIRS — prompt and response scan"
    type: ai-custom-guardrail
    enabled: true
    config:

      # DOCUMENTED. Enum BOTH | INPUT | OUTPUT. One policy covers both legs;
      # $(source) tells the content function which AIRS key to build. Prisma
      # AIRS keys the two directions differently (contents[].prompt versus
      # contents[].response) and runs a different detector set on each, so the
      # direction is not cosmetic.
      guarding_mode: BOTH

      # DOCUMENTED, and chosen over the schema default `last_message`
      # deliberately. `concatenate_all_content` is the only value under which a
      # role:"tool" result — where an untrusted external system injects into the
      # conversation — reaches the scanner.
      #
      # MEASURED (2026-09-08, AI Gateway 2.0.3): the text is the message
      # contents joined by "\n\n" in REVERSE chronological order, system prompt
      # included, with NO indication of who said what. Two consequences to plan
      # for rather than discover: a system prompt that reads like an injection
      # is a false-positive surface, and larger payloads cost more AIRS tokens
      # per scan.
      #
      # A THIRD consequence turned out to be the serious one. MEASURED
      # (2026-09-14, AI Gateway 2.0.3) on a live tenant: an unattributed join of
      # an ordinary conversation is blocked as prompt injection, because the
      # model's own previous answer reads as an assertion planted in the prompt.
      # airs_contents therefore rebuilds the scanned text from the request body
      # with each turn attributed, and this value is now the FALLBACK used when
      # that rebuild meets a body shape it does not understand. It still has to
      # be concatenate_all_content for that fallback to be the widest one.
      #
      # MEASURED, and this is a coverage GAP the README states plainly:
      # tools[].function.description and assistant tool_calls[].function.arguments
      # are NOT message content and never enter $(content) under any value of
      # this setting. They ARE in the raw request body, which airs_contents can
      # read, so params.tool_scan below puts them in front of the scanner --
      # opt-in, off by default. What no setting reaches is a tool call on the
      # leg the model emits it on: GAP 2, README and docs/DESIGN.md 8.2.
      text_source: concatenate_all_content

      # DOCUMENTED. Restated rather than left to the default because both are
      # load-bearing: stop_on_error is what refuses traffic when the call to
      # AIRS itself fails, and 10 s of added latency against an unreachable
      # endpoint is too long for an inline control.
      timeout: 5000
      ssl_verify: true
      stop_on_error: true

      # DOCUMENTED, policy-only — absent from the Kong Gateway plugin schema.
      #
      # continue_on_detection: false — enforce. For a genuine observe-only
      # rollout, set continue_on_detection: true on this same policy: the scan
      # still runs and the detection is still recorded, but the request is not
      # refused. No second file is needed.
      continue_on_detection: false
      # rejection_mode: none — the client receives the generic block message,
      # which carries the scan_id so support can find the scan in Strata Cloud
      # Manager. `stealth` returns a bare 403 for estates that treat the
      # existence of a block as information. UNVERIFIED: the exact status line
      # and body of each mode on a live 2.x data plane — docs/DESIGN.md.
      rejection_mode: none
      # log_blocked_content: false — a blocked prompt is by definition content
      # somebody tried to send through a security control. Keeping it out of
      # Kong's telemetry is the privacy-preserving default; the full record
      # lives in the AIRS scan log where it is access-controlled. Flip to true
      # only with a deliberate decision.
      log_blocked_content: false

      # DOCUMENTED: the policy schema describes this as the number of BYTES
      # received from upstream before the buffer is handed to the guardrail, and
      # the default is 100.
      #
      # MEASURED (2026-09-14, AI Gateway 2.0.3), against a guardrail service
      # that counted every call it received: this is the SEGMENT SIZE of
      # chunked OUTPUT scanning on a streamed response, not a total-answer
      # buffer. A 309-character streamed answer at the default (100) produced
      # 3 OUTPUT calls of 101/104/103 characters; at 512, 2 calls for 1148
      # characters; at 2048, ZERO calls -- the stream ended before the
      # threshold was ever reached. Non-streamed replies are always ONE call
      # carrying the whole body, at every value tried. A large value therefore
      # buys nothing on the buffered path and, on the streamed path, is
      # INFERRED (not re-measured) to be why an earlier revision of this file
      # believed the response leg never runs on a stream at all -- the
      # zero-calls-at-a-large-buffer result above is measured, that it explains
      # the earlier reading is an inference.
      # See GAP 1 in the README, and `config/lab/lab-model.yaml`
      # for how to reproduce the segment behaviour. NEVER set a large value
      # here "to scan a whole streamed answer at once": it scans nothing. Left
      # at the schema default (100) by not setting the key.

      params:
        # Your AIRS security profile name, supplied at apply time so that no
        # tenant-specific value is committed:
        #     export PRISMA_AIRS_PROFILE_NAME=my-profile
        profile: !env PRISMA_AIRS_PROFILE_NAME
        app_name: "kong-ai-gateway"

        # MEASURED (2026-09-14, AI Gateway 2.0.3): a guardrail function body
        # reaches the Kong PDK, so the model name, the caller's address and the
        # authenticated consumer are all available to airs_metadata and no
        # longer have to be pinned per policy. The consumer lookup is reachable
        # but was never exercised with an authenticated consumer -- the lab
        # model carried no auth -- so what has actually been measured end to
        # end is the header label below. app_user and ai_model remain
        # accepted here as the LAST fallback, for an operator who prefers a
        # fixed label on a policy attached to one consumer group:
        #   app_user: "team-a"
        #   ai_model: "my-model"

        # user_header names a request header carrying the end user, used only
        # when Kong has authenticated no consumer. It is caller-supplied, so it
        # labels a scan and must never be read as an authenticated identity.
        # Point it at whatever header your application already sends.
        user_header: "x-airs-user"

        # Correlation. session_header names the CONVERSATION, which only the
        # caller can know -- absent, a conversation is a single exchange. The
        # ROUND is Kong's own request id and needs no configuration;
        # transaction_header exists only for an application trusted to name its
        # own rounds, and hands that choice to the caller, so leave it unset
        # unless you mean it. See docs/DESIGN.md section 7.
        session_header: "x-airs-session-id"
        # transaction_header: "x-airs-transaction-id"

        # tool_scan closes part of GAP 2, and it is off unless set to exactly
        # "calls" or "catalogue". MEASURED (2026-09-14): tools[] and
        # tool_calls[].function.arguments are not message content and never
        # enter $(content) under any text_source, but the raw request body
        # carries both, so airs_contents can put them in front of the
        # detectors. "calls" appends the arguments the model generated;
        # "catalogue" also prepends the tool declarations, which is the
        # tool-poisoning surface -- and the one a profile with the source_code
        # detector flags, because a JSON parameter schema reads as code. Try
        # either against your own profile before enabling it in production.
        # tool_scan: "calls"

      request:
        # The hostname depends on your tenant's region. The endpoint shipped
        # below is the one this configuration was built and measured against; if
        # your profile is in a region with a different hostname, take it from
        # your AIRS onboarding rather than guessing.
        url: https://service.api.aisecurity.paloaltonetworks.com/v1/scan/sync/request

        # DOCUMENTED. request.auth.value is the only field in this schema marked
        # BOTH referenceable and encrypted, so the vault reference resolves here
        # and the stored value is encrypted at rest. It also keeps the key out
        # of the `conf` table handed to every guardrail function, which
        # config.params does not.
        #
        # WHICH VAULT. The reference names a Vault entity, and the choice of
        # vault decides where the key rests:
        #
        #   vault://airs/prisma-airs-api-key  with a `type: konnect` vault -- the key is
        #     held in a Konnect Config Store, written at apply time from a
        #     deferred !secret. Nothing is needed on the data plane host. This
        #     is what config/lab/airs-secret.yaml creates.
        #
        #   vault://airs/prisma-airs-api-key  with a `type: env` vault and NO
        #     config.prefix -- the env vault PREPENDS the prefix to the key in
        #     the reference, so `prefix: AIRS_` would resolve the wrong variable
        #     entirely. See docs/DEPLOYMENT.md section 5 for the rule and both
        #     working combinations. Without a prefix this resolves the key from
        #     the DATA PLANE's own environment, so the
        #     key never reaches Kong's control plane at all. Prefer this where a
        #     security vendor credential must not sit in a SaaS control plane.
        #
        # The reference below is identical either way; only the Vault entity
        # changes. See config/lab/airs-secret.yaml and docs/DEPLOYMENT.md.
        auth:
          location: header
          name: x-pan-token
          value: "{vault://airs/prisma-airs-api-key}"

        headers:
          # Not optional. AIRS answers 415 to a scan POST without a content type.
          Content-Type: "application/json"
          Accept: "application/json"

        # request.body is a flat map of strings; nested YAML fails schema
        # validation. Nested JSON comes from functions that return a table.
        #
        # MEASURED (2026-09-08): functions are referenced BARE. The
        # explicit-argument form $(airs_contents(source, content)) returns
        # HTTP 500 "invalid expression syntax" and no request reaches the model.
        # Built-ins are injected by PARAMETER NAME.
        body:
          # Correlation identifiers, built by airs_correlation below. They nest
          # and they are not interchangeable: transaction_id is one ROUND -- a
          # prompt and the response it produced -- and carries the same value on
          # both legs so Strata Cloud Manager shows one exchange rather than two
          # unrelated scans; session_id is the CONVERSATION grouping several
          # rounds, taken from the caller's header and falling back to the round
          # so an exchange is never split across two sessions.
          #
          # tr_id is deliberately absent. MEASURED (2026-09-14): it is the older
          # name of session_id, NOT of transaction_id -- a request carrying only
          # tr_id comes back with session_id set to that value. Sending the
          # round under it files the round in the conversation slot.
          #
          # MEASURED (2026-09-14): a field the function leaves nil is omitted
          # from the payload, and AIRS then generates pan_<uuid> for that slot.
          # A field set to an empty string is rendered as JSON false instead,
          # which is why airs_correlation returns nothing rather than blanks.
          transaction_id: "$(airs_correlation.transaction_id)"
          session_id: "$(airs_correlation.session_id)"
          ai_profile: "$(airs_profile)"
          metadata: "$(airs_metadata)"
          contents: "$(airs_contents)"

      response:
        block: "$(airs_verdict.block)"
        block_message: "$(airs_verdict.block_message)"

      # MEASURED (2026-09-14, AI Gateway 2.0.3): with block_detail wired to a
      # STRING expression, that metric is DROPPED at runtime, on every single
      # request, allowed or blocked. The data plane logged
      #   [ai-custom-guardrail] metric input_block_detail has unexpected type
      #   string, expected table
      # and no value was exported. block_reason as a string logs no warning.
      #
      # FIXED, MEASURED (2026-09-14, AI Gateway 2.0.3): the runtime wants a
      # Lua TABLE. Kong's policy reference types this field as `string`, which
      # is the type of the config VALUE -- the expression template below -- and
      # says nothing about what that template must render to; the runtime
      # type-checks the RENDERED value. An undocumented rendering requirement,
      # not a contradiction. airs_verdict's `detail` is now
      # `{ reason, category, detections }` on every path, including allow (an
      # empty table). With a table the warning disappears and both metrics are
      # exported: a `file-log` policy attached to the same model shows
      # `ai.proxy.custom-guardrail.input_block_detail` populated with
      # `{category, reason, detections}`. Whether block_reason was still
      # exported while block_detail was a string was never measured, so it is
      # not claimed here. The category and detector names still never reach the
      # client -- they are only in this table and in the SCM scan log,
      # correlated by scan_id.
      metrics:
        block_reason: "$(airs_verdict.block_message)"
        block_detail: "$(airs_verdict.detail)"

      functions:
        # GENERATED FROM lua/guardrail/ — edit there, then run
        # scripts/build-config.py. Do not hand-edit.
        airs_profile: "__INLINE__lua/guardrail/airs_profile.lua"
        airs_correlation: "__INLINE__lua/guardrail/airs_correlation.lua"
        airs_metadata: "__INLINE__lua/guardrail/airs_metadata.lua"
        airs_contents: "__INLINE__lua/guardrail/airs_contents.lua"
        airs_verdict: "__INLINE__lua/guardrail/airs_verdict.lua"

# =============================================================================
# Attaching the policy: SIMPLE mode versus STRICT mode on streaming.
#
# Take your existing AI Model and add ONE policy reference. What you do about
# `response_streaming` decides which of two honest postures you are in — there
# is no config that gives both full streaming AND full response coverage.
#
# SIMPLE MODE (leave response_streaming: allow, the schema default). MEASURED
# (2026-09-14, AI Gateway 2.0.3 / Kong Gateway 3.14.0.3; attribution in
# docs/CREDITS.md): the OUTPUT phase DOES run on a stream, once per
# response_buffer_size segment. Coverage is real but partial and best-effort.
# Roughly 100 bytes must accumulate before the phase runs at all, so an answer
# SHORTER than that is never scanned in its entirety (most chat-UI answers are
# short) -- on a longer answer those first ~100 bytes are the first segment
# scanned. Whatever is still below the threshold when the stream ends is never
# scanned either, and a block always lands AFTER the flagged segment has
# already reached the client (HTTP 200 already sent) — leak before a cut is
# roughly output rate x AIRS scan latency. Good enough for a streaming UX
# where "eventually blocked, mostly" is an acceptable bar.
#
# STRICT MODE (response_streaming: deny on the AI Model, below). Two statements
# to hold side by side rather than reconcile. DOCUMENTED by Kong: "You can't
# add AI Policies that use the Response Transformer Policy or otherwise trigger
# in the response phase when streaming is configured" -- Kong documents the
# combination as UNSUPPORTED and says nothing about how it behaves. MEASURED
# (2026-09-14, above): the phase does run, per segment. The measurement
# contradicts the documentation, both are recorded, and the practical reading
# is that simple mode relies on behaviour Kong does not commit to. MEASURED
# (2026-09-12): with deny, a stream:true request is refused at HTTP 400 before
# any scan runs; buffered traffic is unaffected. Full response coverage, no
# streaming. This is the only way to guarantee the whole answer is scanned
# before the client sees any of it.
#
# If some models must stream and also need STRICT coverage, attach to those
# models a second copy of this policy with guarding_mode: INPUT, and state
# plainly that their coverage is prompt-only — rather than assuming SIMPLE
# mode's per-segment OUTPUT scanning is equivalent to a buffered scan.
# =============================================================================
#
# ai_gateway_models:
#   - ref: my-model
#     ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
#     name: my-model
#     type: model
#     formats:
#       - type: openai
#     config:
#       response_streaming: deny
#     policies:
#       # By NAME, not !ref — the value is the policy's `name` field.
#       - airs-scan
#     targets:
#       - name: gpt-4o
#         provider: generic-openai
#         config:
#           type: openai
#     capabilities:
#       - generate
