[package]
name = "prisma_airs_guardrails"
version = "1.0.0"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "YOUR_ANYPOINT_ORG_ID"
definition_asset_id = "prisma-airs-guardrails"
implementation_asset_id = "prisma-airs-guardrails-flex"

[dependencies]
pdk = { version = "1.10.0", features = ["enable_stop_iteration"] }
prisma-airs-core = { path = "core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"

[dev-dependencies]
pdk-test = { version = "1.10.0" }
pdk-unit = { version = "1.10.0" }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
